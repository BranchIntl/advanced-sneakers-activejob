name: Main

on: [push,pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    container: ruby:${{ matrix.ruby }}

    services:
      rabbitmq:
        # Quorum queues gained x-message-ttl support in RabbitMQ 3.10; the
        # leveled delayed topology (delay.level.* quorum queues with TTL)
        # cannot be declared on older brokers. Match production (>= 3.10).
        image: rabbitmq:${{ matrix.rabbitmq || '3.13' }}-management-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics -q listeners"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '2.5'
          - '2.6'
          - '2.7'
          - '3.0'
          - '3.1'
          - '3.2'
        gemfile:
          - gemfiles/activejob_6.0.x.gemfile
          - gemfiles/activejob_6.1.x.gemfile
          - gemfiles/activejob_7.0.x.gemfile
          - gemfiles/activejob_7.1.x.gemfile
        exclude:
          - ruby: '2.5'
            gemfile: gemfiles/activejob_7.0.x.gemfile
          - ruby: '2.6'
            gemfile: gemfiles/activejob_7.0.x.gemfile
          - ruby: '2.5'
            gemfile: gemfiles/activejob_7.1.x.gemfile
          - ruby: '2.6'
            gemfile: gemfiles/activejob_7.1.x.gemfile
          - ruby: '3.2'
            gemfile: gemfiles/activejob_6.0.x.gemfile
          - ruby: '3.2'
            gemfile: gemfiles/activejob_6.1.x.gemfile
        # Each include entry is its own job: Ruby 3.4 and Rails 8.1 on both RabbitMQ 3.13 and 4.2.
        include:
          - ruby: '3.4'
            gemfile: gemfiles/activejob_8.1.x.gemfile
            rabbitmq: '3.13'
          - ruby: '3.4'
            gemfile: gemfiles/activejob_8.1.x.gemfile
            rabbitmq: '4.2'
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install dependencies
      env:
        BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      run: |
        bundle install --jobs 4 --retry 3
    - name: Run the default task
      env:
        BUNDLE_GEMFILE: ${{ matrix.gemfile }}
        RABBITMQ_URL: amqp://guest:guest@rabbitmq/advanced_sneakers
      run: rake
